<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Open Air Practice</title>
    <meta name="description" content="Outdoor work by Open Air Practice in Seoseok, Gangwon Province, since October 2025.">
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="site">
      <header>
        <div class="bluebar">
          <a class="title-label" href="./">OPEN AIR PRACTICE</a>
        </div>
        <nav class="yellowbar" aria-label="Browse by year">
          <div id="years"></div>
          <button id="info">Info</button>
        </nav>
      </header>
      <main class="work-scroll" id="records" aria-label="Photo archive">
        <p class="loading-message">Loading the archive…</p>
      </main>
      <section class="index-panel" aria-label="Archive index">
        <div class="bluebar">
          <span class="title-label">INDEX</span>
        </div>
        <div class="index-columns orangebar">
          <span>#</span>
          <span>Name</span>
          <span>Place</span>
          <span>Year</span>
        </div>
        <div class="index-scroll" id="index"></div>
      </section>
    </div>
    <div id="modal-root"></div>
  </body>
</html>
